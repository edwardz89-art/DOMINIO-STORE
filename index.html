  item.onclick=()=>toggleModelos(t);
  item.appendChild(cont); lista.appendChild(item);
});

function toggleModelos(t){
  let cont=document.getElementById("modelos-"+t);
  cont.style.display = cont.style.display==="block"?"none":"block";
  cont.innerHTML="";
  if(!modelosPorTalla[t]){cont.innerHTML="<p>No hay modelos disponibles.</p>";return;}
  modelosPorTalla[t].forEach(m=>{
    let div=document.createElement("div"); div.className="modelo";
    div.onclick = (e) => {
  e.stopPropagation(); // 👈 evita que se cierre la talla
  abrirModal(m);
};

    div.innerHTML=`<img src="${m.imagen}"><div><h3>${m.nombre}</h3><p>${m.precio}</p></div>`;
    cont.appendChild(div);
  });
}

function abrirModal(m){
  document.getElementById("modalTitulo").innerText = m.nombre;
  document.getElementById("modalPrecio").innerText = m.precio;

  let video = document.getElementById("modalVideo");
  let img = document.getElementById("modalImagen");
  let src = document.getElementById("modalVideoSrc");	

  if (m.video) {
    src.src = m.video;
    video.style.display = "block";
    img.style.display = "none";

    video.muted = true;       // 🔥 SIEMPRE MUTEADO
    video.playsInline = true; // 🔥 iPhone fix
    video.load();
    video.play();
  } 
  else {
    img.src = m.imagen;
    img.style.display = "block";
    video.style.display = "none";
  }

  document.getElementById("modalWspBoton").href =
    `https://wa.me/51923285372?text=Hola, quiero el modelo ${m.nombre}`;

  document.getElementById("modalProducto").style.display = "flex";

}
